# 公开仓库 hugxu0/whisper-ios 里的打包流程（这个文件在私有仓库的 ios/ 下，同步过去后位于仓库根目录）。
# 推送到 main 就打一个未签名的 IPA，产物在 Actions 的 artifacts 里。
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 打包未签名 IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装 XcodeGen
        run: command -v xcodegen >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      # 私有仓库之前打到了第 10 个版本，这里接着往上编号
      - name: 归档
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Whisper.xcodeproj \
            -scheme Whisper \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Whisper.xcarchive" \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION=$((10 + ${{ github.run_number }})) \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: 打包 IPA
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Whisper.xcarchive/Products/Applications/Whisper.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          SOURCE=$(cat SOURCE_COMMIT 2>/dev/null || echo "${GITHUB_SHA::7}")
          NAME="Whisper-${VERSION}-${BUILD}-${SOURCE}.ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/Whisper.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$NAME" Payload)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ runner.temp }}/ipa/${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30
